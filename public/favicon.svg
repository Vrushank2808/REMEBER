<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background base rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Tactical pulse rings -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#ef4444" stroke-width="0.75" stroke-opacity="0.25" />

  <!-- Central Shield Badge -->
  <path d="M 32 10 L 49 17 C 49 32 39 46 32 51 C 25 46 15 32 15 17 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />

  <!-- Inner shield accent line -->
  <path d="M 32 14 L 45 19.5 C 45 31 37.5 42 32 46.5 C 26.5 42 19 31 19 19.5 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1" 
        stroke-opacity="0.3" />

  <!-- Bold Stylized Letter "R" -->
  <!-- Clean vector paths for "R" -->
  <path d="M 27 21 L 34.5 21 C 37.8 21 40 22.8 40 25.5 C 40 28.2 37.8 30 34.5 30 L 30.5 30 L 30.5 41 L 27 41 Z M 30.5 24.2 L 30.5 27.2 L 34 27.2 C 35.8 27.2 36.8 26.4 36.8 25.7 C 36.8 24.8 35.8 24.2 34 24.2 Z" 
        fill="#ffffff" />
  <!-- R leg -->
  <path d="M 33 29.5 L 39.5 41 L 35.5 41 L 29.8 30 Z" fill="#ffffff" />

  <!-- Small Amber Radar Warning Beacon -->
  <circle cx="45" cy="15" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
  <circle cx="45" cy="15" r="5" fill="none" stroke="#f59e0b" stroke-width="0.75" opacity="0.6" />
</svg>
